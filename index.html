<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ScamSpotter: a quick-reference guide to common online scams.">
  <title>ScamSpotter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main navigation">
      <a class="logo" href="index.html">Scam<span>Spotter</span></a>
      <a class="watchlist-link" href="#watchlist">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>Watchlist</span>
      </a>
    </nav>
  </header>

  <main id="main-content" class="container">

    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Spot the scam before it spots you</h1>

      <form class="search-form" role="search" id="search-form" novalidate>
        <label for="search-input" class="visually-hidden">Search scams</label>
        <svg aria-hidden="true" class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search scams (e.g. bank)" autocomplete="off">
      </form>
      <p id="search-message" class="form-message" role="status" aria-live="polite"></p>

      <div class="filters" role="group" aria-label="Filter scams by channel">
        <button type="button" class="chip is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="sms" aria-pressed="false">SMS</button>
        <button type="button" class="chip" data-filter="email" aria-pressed="false">Email</button>
        <button type="button" class="chip" data-filter="whatsapp" aria-pressed="false">WhatsApp</button>
        <button type="button" class="chip" data-filter="call" aria-pressed="false">Phone Call</button>
      </div>
    </section>

    <section class="scam-list" aria-labelledby="list-title">
      <h2 id="list-title" class="visually-hidden">Common scams</h2>
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      <div id="scam-container" class="scam-container"></div>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <p id="no-results" class="no-results" role="status" hidden></p>
    </section>

  </main>

  <footer class="site-footer">
    <p>ScamSpotter. Educational use only.</p>
  </footer>

  <script src="script.js" charset="UTF-8"></script>
</body>
</html>
